<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Teleport booking state machine</title>
  <desc id="desc">A booking is modeled across independent payment, dispatch, and fulfillment axes. Payment progresses from pending to paid or failed and can later be refunded. Dispatch begins after payment and can assign a driver, end with no driver found, retry, or cancel. Fulfillment progresses from the assigned driver arriving through delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f1d"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#60a5fa"/></marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#34d399"/></marker>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#fbbf24"/></marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}.lane{font:700 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px}.state{font:700 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}.cmd{font:600 10px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}.note{font:400 13px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a8b3c7}.payment{fill:#172554;stroke:#3b82f6;stroke-width:1.6}.dispatch{fill:#052e2b;stroke:#10b981;stroke-width:1.6}.fulfill{fill:#422006;stroke:#f59e0b;stroke-width:1.6}.terminal{fill:#3f1724;stroke:#fb7185;stroke-width:1.6}.b{fill:none;stroke:#60a5fa;stroke-width:2.2;marker-end:url(#arrowB)}.g{fill:none;stroke:#34d399;stroke-width:2.2;marker-end:url(#arrowG)}.a{fill:none;stroke:#fbbf24;stroke-width:2.2;marker-end:url(#arrowA)}.cross{fill:none;stroke:#a78bfa;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowB)}
    </style>
  </defs>
  <rect width="1440" height="980" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">Booking state machine</text><text x="64" y="95" class="subtitle">Three independent axes prevent payment, matching, and parcel custody from being conflated</text>

  <rect x="52" y="128" width="1336" height="204" rx="20" fill="#0f172a" stroke="#1e3a5f"/><text x="76" y="161" class="lane" fill="#60a5fa">PAYMENT</text>
  <g><rect x="78" y="205" width="145" height="52" rx="14" class="payment"/><text x="150" y="237" text-anchor="middle" class="state">PENDING</text><rect x="285" y="205" width="145" height="52" rx="14" class="payment"/><text x="357" y="237" text-anchor="middle" class="state">PROCESSING</text><rect x="492" y="205" width="145" height="52" rx="14" class="payment"/><text x="564" y="237" text-anchor="middle" class="state">PAID</text><rect x="699" y="205" width="184" height="52" rx="14" class="payment"/><text x="791" y="237" text-anchor="middle" class="state">REFUND_PENDING</text><rect x="945" y="205" width="145" height="52" rx="14" class="payment"/><text x="1017" y="237" text-anchor="middle" class="state">REFUNDED</text><rect x="1168" y="205" width="145" height="52" rx="14" class="terminal"/><text x="1240" y="237" text-anchor="middle" class="state">FAILED</text></g>
  <path d="M223 231H285" class="b"/><text x="254" y="220" text-anchor="middle" class="cmd">PROCESS</text><path d="M430 231H492" class="b"/><text x="461" y="220" text-anchor="middle" class="cmd">SUCCEED</text><path d="M637 231H699" class="b"/><text x="668" y="220" text-anchor="middle" class="cmd">REFUND</text><path d="M883 231H945" class="b"/><text x="914" y="220" text-anchor="middle" class="cmd">COMPLETE</text><path d="M357 257V292H1240V257" class="b"/><text x="797" y="310" text-anchor="middle" class="cmd">PAYMENT_FAILED / EXPIRY</text>

  <rect x="52" y="358" width="1336" height="234" rx="20" fill="#0f172a" stroke="#164e43"/><text x="76" y="391" class="lane" fill="#34d399">DISPATCH</text>
  <g><rect x="78" y="448" width="156" height="52" rx="14" class="dispatch"/><text x="156" y="480" text-anchor="middle" class="state">NOT_STARTED</text><rect x="310" y="448" width="145" height="52" rx="14" class="dispatch"/><text x="382" y="480" text-anchor="middle" class="state">SEARCHING</text><rect x="557" y="448" width="145" height="52" rx="14" class="dispatch"/><text x="629" y="480" text-anchor="middle" class="state">ASSIGNED</text><rect x="804" y="412" width="190" height="52" rx="14" class="terminal"/><text x="899" y="444" text-anchor="middle" class="state">NO_DRIVER_FOUND</text><rect x="804" y="505" width="190" height="52" rx="14" class="terminal"/><text x="899" y="537" text-anchor="middle" class="state">CANCELLED</text></g>
  <path d="M234 474H310" class="g"/><text x="272" y="461" text-anchor="middle" class="cmd">PAYMENT_SUCCEEDED</text><path d="M455 474H557" class="g"/><text x="506" y="461" text-anchor="middle" class="cmd">DRIVER_ASSIGNED</text><path d="M455 457C560 399 690 399 804 430" class="g"/><text x="630" y="405" text-anchor="middle" class="cmd">NO_DRIVER_FOUND</text><path d="M804 447C690 470 575 470 455 482" class="g"/><text x="630" y="498" text-anchor="middle" class="cmd">RETRY_MATCHING</text><path d="M455 490C560 555 690 555 804 531" class="g"/><text x="630" y="570" text-anchor="middle" class="cmd">CUSTOMER_CANCELLED</text>

  <rect x="52" y="618" width="1336" height="224" rx="20" fill="#0f172a" stroke="#713f12"/><text x="76" y="651" class="lane" fill="#fbbf24">FULFILLMENT</text>
  <g><rect x="72" y="716" width="136" height="52" rx="14" class="fulfill"/><text x="140" y="748" text-anchor="middle" class="state">NOT_STARTED</text><rect x="246" y="716" width="168" height="52" rx="14" class="fulfill"/><text x="330" y="748" text-anchor="middle" class="state">DRIVER_ARRIVING</text><rect x="452" y="716" width="140" height="52" rx="14" class="fulfill"/><text x="522" y="748" text-anchor="middle" class="state">AT_PICKUP</text><rect x="630" y="716" width="140" height="52" rx="14" class="fulfill"/><text x="700" y="748" text-anchor="middle" class="state">PICKED_UP</text><rect x="808" y="716" width="140" height="52" rx="14" class="fulfill"/><text x="878" y="748" text-anchor="middle" class="state">IN_TRANSIT</text><rect x="986" y="716" width="140" height="52" rx="14" class="fulfill"/><text x="1056" y="748" text-anchor="middle" class="state">DELIVERED</text><rect x="1164" y="716" width="140" height="52" rx="14" class="terminal"/><text x="1234" y="748" text-anchor="middle" class="state">CANCELLED</text></g>
  <path d="M208 742H246" class="a"/><text x="227" y="702" text-anchor="middle" class="cmd">DRIVER_ASSIGNED</text><path d="M414 742H452" class="a"/><text x="433" y="702" text-anchor="middle" class="cmd">DRIVER_ARRIVED</text><path d="M592 742H630" class="a"/><text x="611" y="702" text-anchor="middle" class="cmd">PICKED_UP</text><path d="M770 742H808" class="a"/><text x="789" y="702" text-anchor="middle" class="cmd">START</text><path d="M948 742H986" class="a"/><text x="967" y="702" text-anchor="middle" class="cmd">COMPLETE</text><path d="M140 768V803H1234V768" class="a"/><text x="687" y="820" text-anchor="middle" class="cmd">CUSTOMER_CANCELLED — ONLY BEFORE CUSTODY</text>

  <path d="M564 257V362H382V448" class="cross"/><text x="485" y="350" class="cmd" fill="#c4b5fd">PAID starts matching</text><path d="M629 500V660H330V716" class="cross"/><text x="495" y="649" class="cmd" fill="#c4b5fd">assignment starts fulfillment</text>
  <rect x="52" y="872" width="1336" height="70" rx="16" fill="#0f172a" stroke="#334155"/><text x="76" y="900" class="note">Every command is validated by a shared pure state machine, applied with optimistic concurrency, deduplicated by command ID,</text><text x="76" y="923" class="note">and recorded as one audit event per changed axis. “No driver found” never rewrites a successful payment.</text>
</svg>
